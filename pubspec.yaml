name: plannedit_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  go_router: ^18.0.1
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  dio: ^5.11.1
  image_picker: ^1.2.3
  web_socket_channel: ^3.0.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.1.1
  google_fonts: ^8.2.1
  flutter_markdown: ^0.7.7+1
  internet_connection_checker_plus: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

# Generates the app icon on every platform from your logo.
flutter_launcher_icons:
  image_path: "assets/images/sketch/app_logo_mark.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/sketch/app_logo_mark.png"
  windows:
    generate: true
    image_path: "assets/images/sketch/app_logo_mark.png"
    icon_size: 256
  web:
    generate: true
    image_path: "assets/images/sketch/app_logo_mark.png"
  macos:
    generate: true
    image_path: "assets/images/sketch/app_logo_mark.png"

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/onboarding/
    - assets/images/sketch/
    - assets/icons/
